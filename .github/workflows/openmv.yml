name: OpenMV Firmware

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/openmv.yml'
      - '.github/scripts/openmv_ci.py'
      - 'project/Titan_Mini_Openmv/**'
      - 'rt-thread/**'
      - 'libraries/**'
      - 'FSPConfiguration/**'
  pull_request:
    paths:
      - '.github/workflows/openmv.yml'
      - '.github/scripts/openmv_ci.py'
      - 'project/Titan_Mini_Openmv/**'
      - 'rt-thread/**'
      - 'libraries/**'
      - 'FSPConfiguration/**'
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: OpenMV (${{ matrix.storage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        storage: [sd, flash]
    defaults:
      run:
        shell: bash
        working-directory: project/Titan_Mini_Openmv
    env:
      RTT_CC: gcc
      OPENMV_BUILD: release
      OPENMV_STORAGE: ${{ matrix.storage }}
      MPY_HOST_CC: gcc
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ make xz-utils
          pip install --disable-pip-version-check scons==4.7.0 kconfiglib==14.1.0

      - name: Install Arm GNU Toolchain 13.3.Rel1
        run: |
          archive="$RUNNER_TEMP/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/RT-Thread/toolchains-ci/releases/download/v1.10/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz
          printf '%s  %s\n' \
            95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4 \
            "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          toolchain="$RUNNER_TEMP/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi/bin"
          "$toolchain/arm-none-eabi-gcc" --version
          printf 'RTT_EXEC_PATH=%s\n' "$toolchain" >> "$GITHUB_ENV"

      - name: Select storage configuration
        run: python ../../.github/scripts/openmv_ci.py configure --storage "$OPENMV_STORAGE"

      - name: Build firmware
        run: |
          mkdir -p build/ci
          scons -j"$(nproc)" 2>&1 | tee build/ci/build.log

      - name: Verify and prepare firmware download
        run: python ../../.github/scripts/openmv_ci.py package --storage "$OPENMV_STORAGE"

      - name: Upload firmware
        id: firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titan-mini-openmv-${{ matrix.storage }}-${{ github.sha }}
          path: project/Titan_Mini_Openmv/build/ci/firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        id: diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titan-mini-openmv-${{ matrix.storage }}-debug-${{ github.sha }}
          path: |
            project/Titan_Mini_Openmv/build/ci/build.log
            project/Titan_Mini_Openmv/build/mpy-cross/build.log
            project/Titan_Mini_Openmv/build/firmware/rtthread.elf
            project/Titan_Mini_Openmv/build/firmware/rtthread.map
          if-no-files-found: ignore
          retention-days: 30

      - name: Add download links to run summary
        env:
          FIRMWARE_URL: ${{ steps.firmware.outputs.artifact-url }}
          DIAGNOSTICS_URL: ${{ steps.diagnostics.outputs.artifact-url }}
        run: |
          printf '### Titan Mini OpenMV (%s)\n\n' "$OPENMV_STORAGE" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- [Firmware download](%s)\n- [ELF, MAP and build logs](%s)\n\n' \
            "$FIRMWARE_URL" "$DIAGNOSTICS_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Deploy rtthread.hex and openmv-vision.bin from the same package together.\n' >> "$GITHUB_STEP_SUMMARY"
